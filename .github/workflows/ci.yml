name: CI

"on":
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    name: Build, Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Linting
        run: |
          ruff check . --exclude oss_cases

      - name: Run Test Suite (pytest)
        run: |
          pytest

      - name: Verify Blast Radius Analysis
        run: |
          python blast_radius/scan.py --repo sample_app --target utils.month_date_range --depth 2
          python blast_radius/scan.py --diff blast_radius/graph.json blast_radius/graph_after.json

      - name: Run Deterministic Pipeline Verification
        run: |
          python pipeline/run.py status --format json
          python pipeline/run.py audit --format json
          python pipeline/run.py diff --format json
          python pipeline/run.py verify --bug bug02 --format json
          python pipeline/run.py regression --bug bug02 --format json
          python pipeline/run.py report --bug bug02 --format json
          python pipeline/run.py run --bug bug02 --format json

